<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <style>
      .brand { font-family: 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; letter-spacing: 1px; }
      .model { font-family: 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; letter-spacing: 0.5px; }
    </style>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <!-- Film tongue -->
    <rect x="162" y="424" width="160" height="220" rx="26" fill="#F5F5F5" stroke="#F7F7F7" stroke-width="2"/>
    <rect x="192" y="464" width="80" height="120" rx="16" fill="#FFFFFF" opacity="0.2"/>
    <circle cx="194" cy="602" r="8" fill="#0a0a0a" opacity="0.6"/>
    <circle cx="232" cy="602" r="8" fill="#0a0a0a" opacity="0.6"/>
    <circle cx="270" cy="602" r="8" fill="#0a0a0a" opacity="0.6"/>

    <!-- Cap -->
    <rect x="232" y="174" width="560" height="88" rx="18" fill="#242424" stroke="#F7F7F7" stroke-width="2"/>
    <rect x="402" y="134" width="220" height="50" rx="12" fill="#242424" stroke="#F7F7F7" stroke-width="2"/>

    <!-- Body -->
    <rect x="232" y="234" width="560" height="680" rx="64" fill="#111111" stroke="#F7F7F7" stroke-width="2"/>
    <rect x="256" y="258" width="512" height="632" rx="56" fill="none" stroke="#2d2d2d" stroke-width="1"/>

    <!-- Diagonal band (fixed position) -->
    <path d="M 232 709 L 792 574 L 792 724 L 232 859 Z" fill="#F5F5F5"/>

    <!-- Perforation dots -->
    <circle cx="622" cy="834" r="10" fill="#0a0a0a" opacity="0.55"/>
    <circle cx="672" cy="834" r="10" fill="#0a0a0a" opacity="0.55"/>
    <circle cx="722" cy="834" r="10" fill="#0a0a0a" opacity="0.55"/>

    <!-- Text (kept above band) -->
    <text x="512" y="356" font-size="104" class="brand" text-anchor="middle" fill="#F7F7F7">ILFORD</text>
    <text x="512" y="476" font-size="92" class="model" text-anchor="middle" fill="#F7F7F7">
      <tspan x="512" dy="0">HP5 Plus</tspan>
      <tspan x="512" dy="82">400</tspan>
    </text>
  </g>
</svg>
